name: Validate ReZephyr tokens

on:
  push:
    paths:
      - "tokens/**"
      - "figma/tokens.studio.json"
      - ".github/workflows/validate-tokens.yml"
  pull_request:
    paths:
      - "tokens/**"
      - "figma/tokens.studio.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install ajv
        run: npm init -y && npm install ajv@8 ajv-formats@3 --no-save
      - name: Validate tokens.json against schema
        run: |
          node <<'EOF'
          const fs = require('fs');
          const Ajv = require('ajv');
          const addFormats = require('ajv-formats');
          const ajv = new Ajv({ allErrors: true, strict: false });
          addFormats(ajv);
          const schema = JSON.parse(fs.readFileSync('tokens/tokens.schema.json', 'utf8'));
          const data = JSON.parse(fs.readFileSync('tokens/tokens.json', 'utf8'));
          const validate = ajv.compile(schema);
          if (!validate(data)) {
            console.error(validate.errors);
            process.exit(1);
          }
          const required = ['4924AC', '9C84F2', 'F2F1F7', '0C0B12'];
          const raw = JSON.stringify(data);
          for (const hex of required) {
            if (!raw.toUpperCase().includes(hex)) {
              console.error('Missing brand hex', hex);
              process.exit(1);
            }
          }
          const studio = JSON.parse(fs.readFileSync('figma/tokens.studio.json', 'utf8'));
          if (!studio.global || !studio.global.color) {
            console.error('tokens.studio.json missing global.color');
            process.exit(1);
          }
          console.log('OK — tokens.json + tokens.studio.json');
          EOF
