name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0-beta.3)"
        required: true
        default: "v1.0.0-beta.3"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Simulated platform tests
        run: node tests/harness/run-all.mjs

      - name: Install MAUI workload
        run: dotnet workload install maui-windows maui-android --skip-manifest-update

      - name: Pack NuGet (MAUI + Avalonia)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          dotnet pack platforms/maui/ReZephyr.Maui/ReZephyr.Maui.csproj -c Release -o artifacts
          dotnet pack platforms/avalonia/ReZephyr.Avalonia/ReZephyr.Avalonia.csproj -c Release -o artifacts

      - name: Pack npm (@rezephyr/react)
        shell: pwsh
        run: |
          Push-Location platforms/react
          npm pack --pack-destination ../../artifacts
          Pop-Location

      - name: Zip tokens + license
        shell: pwsh
        run: |
          Compress-Archive -Path tokens/tokens.json,tokens/tokens.css,tokens/tokens.schema.json,LICENSE,NOTICE,CONSUMING.md,GUIDE.md -DestinationPath artifacts/rezephyr-tokens-v1.0.0-beta.3.zip -Force

      - name: Resolve tag
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            echo "tag=${{ inputs.tag }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ReZephyr ${{ steps.meta.outputs.tag }}
          body: |
            ## ReZephyr ${{ steps.meta.outputs.tag }}

            Tokenized design system by **Hamed Rezaei Aderyani (Himo / himoN7) · Himpire**.

            **License:** ReZephyr Attribution License — use freely with credit:
            `Design system: ReZephyr by Hamed Rezaei Aderyani (Himo / himoN7) · Himpire`
            https://github.com/himoN7/rezephyr

            Full guide: GUIDE.md (humans + AI). HimoZ is a Figma workspace label only.

            ### Consume
            See [CONSUMING.md](https://github.com/himoN7/rezephyr/blob/main/CONSUMING.md)

            ### Assets
            - `ReZephyr.Maui.*.nupkg` — .NET MAUI package
            - `ReZephyr.Avalonia.*.nupkg` — Avalonia token stubs
            - `rezephyr-react-*.tgz` — React / TypeScript package
            - `rezephyr-tokens-*.zip` — tokens.json + tokens.css + LICENSE

            Slogan: Design system made for human and AI
          files: |
            artifacts/*
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
