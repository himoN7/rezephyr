name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0-beta.3)"
        required: true
        default: "v1.0.0-beta.3"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Simulated platform tests
        run: node tests/harness/run-all.mjs

      - name: Install MAUI workload
        run: dotnet workload install maui-windows maui-android --skip-manifest-update

      - name: Pack NuGet (MAUI + Avalonia + Tokens)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          dotnet pack platforms/maui/ReZephyr.Maui/ReZephyr.Maui.csproj -c Release -o artifacts
          dotnet pack platforms/avalonia/ReZephyr.Avalonia/ReZephyr.Avalonia.csproj -c Release -o artifacts
          dotnet pack platforms/tokens-nuget/ReZephyr.Tokens/ReZephyr.Tokens.csproj -c Release -o artifacts

      - name: Pack npm (@rezephyr/react)
        shell: pwsh
        run: |
          Push-Location platforms/react
          npm pack --pack-destination ../../artifacts
          Pop-Location

      - name: Pack Flutter package zip
        shell: pwsh
        run: |
          Compress-Archive -Path platforms/flutter/rezephyr/* -DestinationPath artifacts/rezephyr-flutter-1.0.0-beta.3.zip -Force

      - name: Setup Java for Android Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Publish Android Compose to GitHub Maven Packages
        shell: pwsh
        working-directory: platforms/android
        run: |
          ./gradlew.bat :rezephyr:publishReleasePublicationToGitHubPackagesRepository --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Zip tokens + license
        shell: pwsh
        run: |
          Compress-Archive -Path tokens/tokens.json,tokens/tokens.css,tokens/tokens.schema.json,LICENSE,NOTICE,CONSUMING.md,GUIDE.md,Package.swift -DestinationPath artifacts/rezephyr-tokens-v1.0.0-beta.3.zip -Force

      - name: Publish NuGet to GitHub Packages
        shell: pwsh
        run: |
          Get-ChildItem artifacts -Filter "*.nupkg" | ForEach-Object {
            Write-Host "Pushing $($_.Name) to GitHub Packages..."
            dotnet nuget push $_.FullName --source "https://nuget.pkg.github.com/himoN7/index.json" --api-key "$env:GITHUB_TOKEN" --skip-duplicate
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish NuGet to nuget.org
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            Write-Host "NUGET_API_KEY secret not set — skipping nuget.org publish"
            exit 0
          }
          Get-ChildItem artifacts -Filter "*.nupkg" | ForEach-Object {
            Write-Host "Pushing $($_.Name) to nuget.org..."
            dotnet nuget push $_.FullName --source "https://api.nuget.org/v3/index.json" --api-key "$env:NUGET_API_KEY" --skip-duplicate
          }
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Publish npm to GitHub Packages
        shell: pwsh
        run: |
          # GitHub Packages requires an owner-scoped name; publish a scoped copy.
          Copy-Item -Recurse platforms/react artifacts/npm-gh -Force
          Push-Location artifacts/npm-gh
          npm pkg set name="@himoN7/rezephyr-react"
          npm pkg set publishConfig.registry="https://npm.pkg.github.com"
          echo "@himoN7:registry=https://npm.pkg.github.com" | Out-File -Encoding ascii .npmrc
          echo "//npm.pkg.github.com/:_authToken=$env:GITHUB_TOKEN" | Add-Content -Encoding ascii .npmrc
          npm publish --access public
          Pop-Location
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            echo "tag=${{ inputs.tag }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ReZephyr ${{ steps.meta.outputs.tag }}
          body: |
            ## ReZephyr ${{ steps.meta.outputs.tag }}

            Tokenized design system by **Hamed Rezaei Aderyani (Himo / himoN7) · Himpire**.

            **License:** ReZephyr Attribution License — use freely with credit:
            `Design system: ReZephyr by Hamed Rezaei Aderyani (Himo / himoN7) · Himpire`
            https://github.com/himoN7/rezephyr

            Full guide: GUIDE.md (humans + AI). HimoZ is a Figma workspace label only.

            ### Install from registries
            - **GitHub NuGet:** `ReZephyr.Maui` / `ReZephyr.Avalonia` / `ReZephyr.Tokens`
            - **nuget.org:** when `NUGET_API_KEY` is set (same IDs)
            - **GitHub Maven:** `com.himpire.rezephyr:rezephyr-compose`
            - **GitHub npm:** `@himoN7/rezephyr-react`
            - **Swift SPM:** `https://github.com/himoN7/rezephyr.git` (root `Package.swift`)
            - **Flutter:** git path `platforms/flutter/rezephyr`

            See [CONSUMING.md](https://github.com/himoN7/rezephyr/blob/main/CONSUMING.md)

            ### Assets
            - `ReZephyr.Maui` / `ReZephyr.Avalonia` / `ReZephyr.Tokens` `.nupkg`
            - `rezephyr-react-*.tgz` — React / TypeScript
            - `rezephyr-flutter-*.zip` — Flutter package
            - `rezephyr-tokens-*.zip` — tokens + Package.swift

            Slogan: Design system made for human and AI
          files: |
            artifacts/*.nupkg
            artifacts/*.tgz
            artifacts/*.zip
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
