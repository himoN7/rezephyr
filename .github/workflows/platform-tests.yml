name: ReZephyr platform tests

on:
  push:
  pull_request:

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Simulated contract + web + maui + ios + android
        run: npm test

  build-maui-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install MAUI workload
        run: dotnet workload install maui-windows maui-android --skip-manifest-update
      - name: Build ReZephyr.Maui (windows)
        run: dotnet build platforms/maui/ReZephyr.Maui/ReZephyr.Maui.csproj -f net10.0-windows10.0.19041.0 -c Release
